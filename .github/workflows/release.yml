name: Firmware release
on:
  push:
    tags: ['firmware-*']
permissions:
  contents: read
jobs:
  firmware:
    uses: moergo-sc/zmk/.github/workflows/build-user-config.yml@ce69e85f585c724142aae37ddf8a7e019ff19e93 # v26.09
  release:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware
          path: firmware
      - name: Validate and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/prepare-release.py --artifacts firmware --output release-assets
      - name: Publish verified tag and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false
