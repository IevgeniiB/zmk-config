name: Keymap diagrams
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  diagrams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/draw-requirements.txt
      - run: python -m pip install -r scripts/draw-requirements.txt
      - name: Read dependency pins
        id: pins
        run: |
          python - <<'PY'
          import os, yaml
          projects = yaml.safe_load(open('config/west.yml'))['manifest']['projects']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for project in projects:
                  if project['name'] in ('zmk', 'zmk-helpers'):
                      print(f"{project['name']}={project['revision']}", file=out)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moergo-sc/zmk
          ref: ${{ steps.pins.outputs.zmk }}
          path: .draw-deps/zmk
          sparse-checkout: app/boards/arm/glove80
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: urob/zmk-helpers
          ref: ${{ steps.pins.outputs.zmk-helpers }}
          path: .draw-deps/zmk-helpers
          sparse-checkout: include
      - name: Check committed diagrams against source
        run: python scripts/draw-keymaps.py --workspace .draw-deps --check
