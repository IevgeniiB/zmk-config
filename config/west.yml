manifest:
  remotes:
    - name: moergo-sc # Use moergo zmk fork for full glove80 support
      url-base: https://github.com/moergo-sc
    - name: urob
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: moergo-sc
      revision: ce69e85f585c724142aae37ddf8a7e019ff19e93 # MoErgo v26.09; track main/releases
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: a98b7f7e4a5130a5150dce81bb8aa419fc3ca3c0 # track urob/zmk-helpers v2
    # Override the moving Zephyr branch imported by ZMK; retain its import filter.
    - name: zephyr
      revision: dacab4875df72109b96cc8977547a0dc04875bcd
      import:
        name-blocklist:
        - ci-tools
        - hal_altera
        - hal_cypress
        - hal_infineon
        - hal_microchip
        - hal_nxp
        - hal_openisa
        - hal_silabs
        - hal_xtensa
        - hal_st
        - hal_ti
        - loramac-node
        - mcuboot
        - mcumgr
        - net-tools
        - openthread
        - edtt
        - trusted-firmware-m
      url: https://github.com/zmkfirmware/zephyr
  self:
    path: config
